name: Build and Push Docker Image

on:
  push:
    branches:
      - aaditya-deployment  # This will trigger the action on push to the `main` branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    # Step 2: Log in to Docker Hub using secrets
    - name: Log in to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    # Step 3: Build the Docker image
    - name: Build Docker image
      run: docker build -t aryan4codes/accenture-backend:latest ./backend

    # Step 4: Push the Docker image to Docker Hub
    - name: Push Docker image to Docker Hub
      run: docker push aryan4codes/accenture-backend:latest
